<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DMS - Telemetry History Logs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .history-container {
            padding: 20px;
            height: calc(100vh - 100px);
            overflow-y: auto;
            box-sizing: border-box;
        }
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            align-items: center;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        .filter-bar input, .filter-bar select {
            padding: 8px 10px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--panel-bg);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        th, td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }
        th {
            background: #0f172a;
            color: var(--primary-blue);
        }
        tr:hover {
            background: #334155;
        }
        .pagination-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            background: var(--panel-bg);
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="logo-container">
            <div class="wa-logo" style="font-weight: bold; color: #0284c7; padding: 2px 8px;">WA</div>
            <div class="app-title">Drone Monitoring System - Telemetry Logs</div>
        </div>
        <div>
            <a href="/" class="menu-btn" style="text-decoration: none;">← Back to Live Map</a>
        </div>
    </header>

    <div class="history-container">
        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <label>Drone ID / Model:</label>
                <input type="text" id="searchInput" placeholder="Enter ID or Model...">
            </div>

            <div class="filter-group">
                <label>From Date/Time:</label>
                <input type="datetime-local" id="startTimeInput">
            </div>

            <div class="filter-group">
                <label>To Date/Time:</label>
                <input type="datetime-local" id="endTimeInput">
            </div>

            <button onclick="fetchHistory()" class="menu-btn">🔍 Search</button>
            <button onclick="resetFilters()" class="menu-btn" style="background:#64748b;">Reset</button>

            <div style="margin-left: auto;">
                <button onclick="window.location.href='/api/export_excel'" class="menu-btn" style="background: var(--accent-green);">📥 Export Excel (.xlsx)</button>
            </div>
        </div>

        <!-- Data Table -->
        <table id="historyTable">
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Source</th>
                    <th>Device ID</th>
                    <th>Model</th>
                    <th>Latitude</th>
                    <th>Longitude</th>
                    <th>Altitude (m)</th>
                    <th>Speed (km/h)</th>
                    <th>Heading</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data populated dynamically -->
            </tbody>
        </table>

        <!-- Pagination Controls -->
        <div class="pagination-bar">
            <div>
                Show: 
                <select id="pageSizeSelect" onchange="changePageSize()">
                    <option value="15" selected>15 rows</option>
                    <option value="30">30 rows</option>
                    <option value="50">50 rows</option>
                    <option value="100">100 rows</option>
                </select>
                <span id="recordCountText" style="margin-left: 15px; color: #94a3b8;">Total Records: 0</span>
            </div>

            <div>
                <button onclick="previousPage()" id="prevBtn" class="menu-btn" style="padding: 4px 10px; background: #475569;">◀ Prev</button>
                <span id="pageIndicator" style="margin: 0 10px;">Page 1 of 1</span>
                <button onclick="nextPage()" id="nextBtn" class="menu-btn" style="padding: 4px 10px; background: #475569;">Next ▶</button>
            </div>
        </div>
    </div>

    <script>
        let allRecords = [];
        let currentPage = 1;
        let pageSize = 15;

        function fetchHistory() {
            const droneId = document.getElementById('searchInput').value;
            const startTime = document.getElementById('startTimeInput').value;
            const endTime = document.getElementById('endTimeInput').value;

            let url = `/api/history_data?drone_id=${encodeURIComponent(droneId)}&start_time=${encodeURIComponent(startTime)}&end_time=${encodeURIComponent(endTime)}`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    allRecords = data;
                    currentPage = 1;
                    renderTable();
                });
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            const totalRecords = allRecords.length;
            const totalPages = Math.ceil(totalRecords / pageSize) || 1;

            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const startIndex = (currentPage - 1) * pageSize;
            const endIndex = Math.min(startIndex + pageSize, totalRecords);
            const pageData = allRecords.slice(startIndex, endIndex);

            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color:#94a3b8;">No records found.</td></tr>';
            } else {
                pageData.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.timestamp}</td>
                        <td><span style="color:${row.source === 'wifi_remote_id' ? '#10b981' : '#3b82f6'}; font-weight:bold;">${row.source}</span></td>
                        <td><strong>${row.device_id}</strong></td>
                        <td>${row.model || '--'}</td>
                        <td>${row.latitude}</td>
                        <td>${row.longitude}</td>
                        <td>${row.altitude} m</td>
                        <td>${row.speed} km/h</td>
                        <td>${row.heading}°</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('recordCountText').innerText = `Total Records: ${totalRecords}`;
            document.getElementById('pageIndicator').innerText = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages || totalPages === 0;
        }

        function changePageSize() {
            pageSize = parseInt(document.getElementById('pageSizeSelect').value);
            currentPage = 1;
            renderTable();
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(allRecords.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('startTimeInput').value = '';
            document.getElementById('endTimeInput').value = '';
            fetchHistory();
        }

        // Initial fetch on page load
        fetchHistory();
    </script>
</body>
</html>
